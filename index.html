<!DOCTYPE html>
<html lang="en" class="dark-theme">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="macOS, rebuilt for the modern web. A browser-native macOS desktop environment. No virtualization. No installation. No Apple hardware required." />
  <meta name="theme-color" content="#000000" />
  <meta property="og:title" content="Mateus PC — macOS em Web" />
  <meta property="og:description" content="Ambiente de Trabalho macOS — Mateus PC" />
  <title>Mateus PC 🍎</title>

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="assets/favicons/favicon-96x96.png" sizes="96x96" />
  <link rel="icon" type="image/svg+xml" href="assets/favicons/favicon.svg" />
  <link rel="shortcut icon" href="assets/favicons/favicon.ico" />
  <link rel="apple-touch-icon" sizes="180x180" href="assets/favicons/apple-touch-icon.png" />
  <link rel="manifest" href="manifest.json" />

  <!-- Stylesheet -->
  <link rel="stylesheet" href="css/main.css" />
  <link rel="stylesheet" href="css/patch.css" />
</head>
<body>

  <!-- ═══════════════════════════════════════════
       BOOT SCREEN
  ═══════════════════════════════════════════ -->
  <div id="boot-screen" class="boot-screen" aria-label="Boot Screen" role="status">
    <div class="boot-screen__logo">
      <svg viewBox="0 0 814 1000" xmlns="http://www.w3.org/2000/svg" class="boot-screen__apple">
        <path d="M788.1 340.9c-5.8 4.5-108.2 62.2-108.2 190.5 0 148.4 130.3 200.9 134.2 202.2-.6 3.2-20.7 71.9-68.7 141.9-42.8 61.6-87.5 123.1-155.5 123.1s-85.5-39.5-164-39.5c-76 0-103.7 40.8-165.9 40.8s-105-57.8-155.5-127.4C46 790.9 0 663.4 0 541.8c0-207.6 135.4-317.3 270-317.3 70.7 0 129.5 46.4 173.1 46.4 42.8 0 109.3-49 189.5-49 30.7 0 108.2 2.6 168.5 80.1zm-234-181.5c31.1-36.9 53.1-88.1 53.1-139.3 0-7.1-.6-14.3-1.9-20.1-50.6 1.9-110.8 33.7-147.1 75.8-28.5 32.4-55.1 83.6-55.1 135.5 0 7.8 1.3 15.6 1.9 18.1 3.2.6 8.4 1.3 13.6 1.3 45.4 0 102.5-30.4 135.5-71.3z"/>
      </svg>
    </div>
    <div class="boot-screen__loader" role="progressbar" aria-label="Loading">
      <div class="boot-screen__loader-bar"></div>
    </div>
  </div>

  <!-- ═══════════════════════════════════════════
       MOBILE NOT SUPPORTED
  ═══════════════════════════════════════════ -->
  <div id="mobile-not-supported" class="mobile-not-supported" style="display:none;" aria-label="Mobile Not Supported">
    <div class="mobile-ns__content">
      <svg viewBox="0 0 814 1000" class="mobile-ns__apple">
        <path d="M788.1 340.9c-5.8 4.5-108.2 62.2-108.2 190.5 0 148.4 130.3 200.9 134.2 202.2-.6 3.2-20.7 71.9-68.7 141.9-42.8 61.6-87.5 123.1-155.5 123.1s-85.5-39.5-164-39.5c-76 0-103.7 40.8-165.9 40.8s-105-57.8-155.5-127.4C46 790.9 0 663.4 0 541.8c0-207.6 135.4-317.3 270-317.3 70.7 0 129.5 46.4 173.1 46.4 42.8 0 109.3-49 189.5-49 30.7 0 108.2 2.6 168.5 80.1zm-234-181.5c31.1-36.9 53.1-88.1 53.1-139.3 0-7.1-.6-14.3-1.9-20.1-50.6 1.9-110.8 33.7-147.1 75.8-28.5 32.4-55.1 83.6-55.1 135.5 0 7.8 1.3 15.6 1.9 18.1 3.2.6 8.4 1.3 13.6 1.3 45.4 0 102.5-30.4 135.5-71.3z"/>
      </svg>
      <h1 class="mobile-ns__title">macweb.dev</h1>
      <p class="mobile-ns__text">This experience is designed for desktop browsers.<br/>Please open it on a computer.</p>
    </div>
  </div>

  <!-- ═══════════════════════════════════════════
       MAIN DESKTOP (hidden until boot completes)
  ═══════════════════════════════════════════ -->
  <main id="app" style="display:none;" role="main" aria-label="macOS Desktop Environment">

    <!-- DESKTOP -->
    <div id="desktop" class="desktop" role="application" aria-label="Desktop"></div>

    <!-- MENU BAR -->
    <div id="menubar" class="menuBar" role="navigation" aria-label="Menu Bar">
      <div class="menuBar__left" id="menubar-left">
        <!-- Apple logo item -->
        <div class="menuBar__itemWrapper" id="menubar-apple">
          <span class="menuBar__item isClickable isBold isApple" id="menubar-apple-btn" aria-label="Apple Menu" tabindex="0">
            <svg viewBox="0 0 814 1000" xmlns="http://www.w3.org/2000/svg" class="apple-icon" aria-hidden="true" width="13" height="13">
              <path d="M788.1 340.9c-5.8 4.5-108.2 62.2-108.2 190.5 0 148.4 130.3 200.9 134.2 202.2-.6 3.2-20.7 71.9-68.7 141.9-42.8 61.6-87.5 123.1-155.5 123.1s-85.5-39.5-164-39.5c-76 0-103.7 40.8-165.9 40.8s-105-57.8-155.5-127.4C46 790.9 0 663.4 0 541.8c0-207.6 135.4-317.3 270-317.3 70.7 0 129.5 46.4 173.1 46.4 42.8 0 109.3-49 189.5-49 30.7 0 108.2 2.6 168.5 80.1zm-234-181.5c31.1-36.9 53.1-88.1 53.1-139.3 0-7.1-.6-14.3-1.9-20.1-50.6 1.9-110.8 33.7-147.1 75.8-28.5 32.4-55.1 83.6-55.1 135.5 0 7.8 1.3 15.6 1.9 18.1 3.2.6 8.4 1.3 13.6 1.3 45.4 0 102.5-30.4 135.5-71.3z" fill="currentColor"/>
            </svg>
          </span>
          <div class="menuBar__item-click-overlay" id="menubar-apple-overlay"></div>
          <!-- Apple dropdown (populated by JS) -->
          <div class="menuBar__dropdown apple-menu" id="menubar-apple-dropdown" style="display:none;"></div>
        </div>

        <!-- App name -->
        <div class="menuBar__itemWrapper" id="menubar-appname-wrapper">
          <span class="menuBar__item isClickable isBold" id="menubar-appname">Finder</span>
          <div class="menuBar__item-click-overlay" id="menubar-appname-overlay"></div>
          <div class="menuBar__dropdown" id="menubar-appname-dropdown" style="display:none;"></div>
        </div>

        <!-- Menu items: Arquivo, Editar, Visualizar, Histórico, Favoritos, Desenvolvedor, Janela, Ajuda -->
        <div class="menuBar__itemWrapper" id="menubar-arquivo-wrapper">
          <span class="menuBar__item isClickable" id="menubar-arquivo">Arquivo</span>
          <div class="menuBar__item-click-overlay" id="menubar-arquivo-overlay"></div>
          <div class="menuBar__dropdown" id="menubar-arquivo-dropdown" style="display:none;"></div>
        </div>
        <div class="menuBar__itemWrapper" id="menubar-editar-wrapper">
          <span class="menuBar__item isClickable" id="menubar-editar">Editar</span>
          <div class="menuBar__item-click-overlay" id="menubar-editar-overlay"></div>
          <div class="menuBar__dropdown" id="menubar-editar-dropdown" style="display:none;"></div>
        </div>
        <div class="menuBar__itemWrapper" id="menubar-visualizar-wrapper">
          <span class="menuBar__item isClickable" id="menubar-visualizar">Visualizar</span>
          <div class="menuBar__item-click-overlay" id="menubar-visualizar-overlay"></div>
          <div class="menuBar__dropdown" id="menubar-visualizar-dropdown" style="display:none;"></div>
        </div>
        <div class="menuBar__itemWrapper" id="menubar-historico-wrapper">
          <span class="menuBar__item isClickable" id="menubar-historico">Histórico</span>
          <div class="menuBar__item-click-overlay" id="menubar-historico-overlay"></div>
          <div class="menuBar__dropdown" id="menubar-historico-dropdown" style="display:none;"></div>
        </div>
        <div class="menuBar__itemWrapper" id="menubar-favoritos-wrapper">
          <span class="menuBar__item isClickable" id="menubar-favoritos">Favoritos</span>
          <div class="menuBar__item-click-overlay" id="menubar-favoritos-overlay"></div>
          <div class="menuBar__dropdown" id="menubar-favoritos-dropdown" style="display:none;"></div>
        </div>
        <div class="menuBar__itemWrapper" id="menubar-desenvolvedor-wrapper">
          <span class="menuBar__item isClickable" id="menubar-desenvolvedor">Desenvolvedor</span>
          <div class="menuBar__item-click-overlay" id="menubar-desenvolvedor-overlay"></div>
          <div class="menuBar__dropdown" id="menubar-desenvolvedor-dropdown" style="display:none;"></div>
        </div>
        <div class="menuBar__itemWrapper" id="menubar-janela-wrapper">
          <span class="menuBar__item isClickable" id="menubar-janela">Janela</span>
          <div class="menuBar__item-click-overlay" id="menubar-janela-overlay"></div>
          <div class="menuBar__dropdown" id="menubar-janela-dropdown" style="display:none;"></div>
        </div>
        <div class="menuBar__itemWrapper" id="menubar-ajuda-wrapper">
          <span class="menuBar__item isClickable" id="menubar-ajuda">Ajuda</span>
          <div class="menuBar__item-click-overlay" id="menubar-ajuda-overlay"></div>
          <div class="menuBar__dropdown" id="menubar-ajuda-dropdown" style="display:none;"></div>
        </div>
      </div>

      <div class="menuBar__right" id="menubar-right">
        <!-- Control Center button -->
        <div class="menuBar__controlCenterBtn" id="menubar-cc-btn" aria-label="Control Center" tabindex="0">
          <img src="assets/icons/menuBar/control_center.svg" alt="Control Center" class="menuBar__iconImg" />
        </div>
        <img src="assets/icons/menuBar/battery_charge.png" alt="Battery" class="menuBar__iconImg" />
        <img src="assets/icons/menuBar/wi-fi.png" alt="Wi-Fi" class="menuBar__iconImg" />
        <!-- Clock -->
        <div class="menuBar__clock" id="menubar-clock" aria-live="polite" aria-label="Current time"></div>
      </div>
    </div>

    <!-- WINDOW CONTAINER -->
    <div id="window-container" aria-label="Open Windows"></div>

    <!-- DOCK -->
    <div class="dock-container" id="dock-container">
      <div class="dock" id="dock" role="toolbar" aria-label="Dock"></div>
      <div class="dock dock--github" id="dock-github">
        <div class="dock__item-wrapper">
          <div class="dock__item" id="dock-github-btn" role="button" tabindex="0" aria-label="View Source on GitHub" style="contain: layout style;">
            <div class="dock__tooltip" role="tooltip">View Source by GitHub</div>
            <div class="dock__icon-wrapper">
              <img src="assets/icons/custom/github-desktop.png"
                   alt="GitHub" draggable="false" loading="lazy" style="width:58px;height:58px;object-fit:contain;" />
            </div>
            <div class="dock__indicator"></div>
          </div>
        </div>
      </div>
    </div>

    <!-- CONTROL CENTER PANEL (dynamically shown) -->
    <div id="control-center" class="cc-panel" style="display:none;" role="dialog" aria-label="Control Center"></div>

    <!-- CONTEXT MENU (dynamically shown) -->
    <div id="context-menu" class="context-menu" style="display:none;" role="menu" aria-label="Context Menu"></div>

    <!-- ABOUT THIS MAC (dynamically shown) -->
    <div id="about-this-mac" style="display:none;"></div>

  </main>

  <!-- ═══════════════════════════════════════════
       SCRIPTS (ES modules)
  ═══════════════════════════════════════════ -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
