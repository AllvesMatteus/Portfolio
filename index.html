          <div class="menuBar__dropdown apple-menu" id="menubar-apple-dropdown" style="display:none;"></div>
        </div>

        <div id="menubar-dynamic-items" class="menuBar__dynamicItems"></div>
      </div>

      <div class="menuBar__right" id="menubar-right">
        <div class="menuBar__iconWrapper" id="menubar-battery-btn" aria-label="Bateria" tabindex="0">

        </div>
        <div class="menuBar__iconWrapper" id="menubar-wifi-btn" aria-label="Wi-Fi" tabindex="0">

        <div class="menuBar__iconWrapper" id="menubar-bluetooth-btn" aria-label="Bluetooth" tabindex="0">

        <div class="menuBar__iconWrapper" id="menubar-search-btn" aria-label="Buscar" tabindex="0">

      </div>

    <div id="control-center" class="cc-panel" style="display:none;" role="dialog" aria-label="Control Center"></div>

    <div id="context-menu" class="context-menu" style="display:none;" role="menu" aria-label="Context Menu"></div>
